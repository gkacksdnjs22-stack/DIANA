# Deploy only this file from codex/admin-passkey-https-staging.
# Existing production service and its database are not managed by this Blueprint.
services:
  - type: web
    name: diana-admin-passkey-stage
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/gkacksdnjs22-stack/DIANA
    branch: codex/admin-passkey-https-staging
    autoDeployTrigger: off
    buildCommand: cd security-lab/admin-passkey && npm ci --ignore-scripts --omit=dev --no-audit --no-fund
    startCommand: node security-lab/admin-passkey/staging/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DIANA_STAGE
        value: admin-passkey
      - key: ADMIN_ORIGIN
        value: https://diana-admin-passkey-stage.onrender.com
      - key: ADMIN_RP_ID
        value: diana-admin-passkey-stage.onrender.com
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: diana-admin-stage
          property: connectionString
      - key: ADMIN_DATABASE_TRANSPORT
        value: render-private
      - key: ADMIN_BOOTSTRAP_SHA256
        sync: false
