name: DIANA download integrity
on:
  push:
    paths:
      - 'public/**'
      - 'lib/control.mjs'
      - 'tests/web-landing.test.mjs'
      - 'tests/web-demo.test.mjs'
      - 'android-app/**'
      - 'financial-desktop/**'
      - 'financial-documents/**'
      - 'financial_core/**'
      - 'experiments/financial-review/contract.mjs'
      - 'experiments/financial-review/evaluation-intake-v1/**'
      - 'scripts/build-financial-desktop.mjs'
      - 'tests/release-packages.test.mjs'
      - 'tests/android-release-provenance.test.mjs'
      - 'tests/helpers/android-release.mjs'
      - 'tests/helpers/release-zip.mjs'
      - 'tests/financial-ai-preview-view.test.mjs'
      - 'tests/helpers/ai-preview-dom.mjs'
      - '.github/workflows/release-integrity.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Fetch published source revisions
        shell: bash
        run: |
          source_commits="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const r = JSON.parse(readFileSync("public/downloads/releases.json")); const refs = [r.android.sourceCommit, r.windows.sourceCommit, r.legacy.android.sourceCommit, r.legacy.windows.sourceCommit]; if (!refs.every(ref => /^[a-f0-9]{40}$/.test(ref))) throw Error("Invalid release source commit"); console.log([...new Set(refs)].join(" "));')"
          read -r -a commits <<< "$source_commits"
          git fetch --no-tags --depth=1 origin "${commits[@]}"
      - name: Check published versions, source provenance and packaged sources
        run: node --test tests/release-packages.test.mjs tests/android-release-provenance.test.mjs tests/financial-ai-preview-view.test.mjs
      - name: Install web test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public pages and protected API boundaries
        run: node --test tests/web-landing.test.mjs tests/web-demo.test.mjs
