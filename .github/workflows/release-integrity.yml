name: DIANA download integrity
on:
  push:
    paths:
      - 'public/**'
      - 'lib/control.mjs'
      - 'tests/web-landing.test.mjs'
      - 'tests/web-demo.test.mjs'
      - 'android-app/**'
      - 'financial-desktop/**'
      - 'financial-documents/**'
      - 'financial_core/**'
      - 'experiments/financial-review/contract.mjs'
      - 'experiments/financial-review/evaluation-intake-v1/**'
      - 'scripts/build-financial-desktop.mjs'
      - 'tests/release-packages.test.mjs'
      - 'tests/android-release-provenance.test.mjs'
      - 'tests/helpers/android-release.mjs'
      - 'tests/helpers/release-zip.mjs'
      - 'tests/financial-ai-preview-view.test.mjs'
      - 'tests/helpers/ai-preview-dom.mjs'
      - '.github/workflows/release-integrity.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Fetch the published Android source revision
        shell: bash
        run: |
          source_commit="$(node -p "JSON.parse(require('node:fs').readFileSync('public/downloads/releases.json', 'utf8')).android.sourceCommit")"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid published Android source commit' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$source_commit"
      - name: Check published versions, source provenance and packaged sources
        run: node --test tests/release-packages.test.mjs tests/android-release-provenance.test.mjs tests/financial-ai-preview-view.test.mjs
      - name: Install web test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public pages and protected API boundaries
        run: node --test tests/web-landing.test.mjs tests/web-demo.test.mjs
