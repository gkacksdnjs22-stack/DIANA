name: Administrator passkey Android lab
on:
  pull_request:
    paths: ['security-lab/admin-passkey/**', '.github/workflows/admin-passkey-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: node security-lab/admin-passkey/build-android.mjs
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: security-lab/admin-passkey/generated/android/android-app
      - uses: actions/upload-artifact@v4
        with:
          name: DIANA-admin-passkey-Android-lab
          path: |
            security-lab/admin-passkey/generated/android/android-app/app/build/outputs/apk/debug/app-debug.apk
            security-lab/admin-passkey/generated/android/android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            security-lab/admin-passkey/generated/android/android-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
