name: DIANA Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 configures sdkmanager on PATH without installing the removed 'tools' package.
      - name: Prepare Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      # The Android project intentionally has no Gradle wrapper checked in.
      # Android Gradle Plugin 8.9.2 requires Gradle 8.11.1 and Java 17.
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :install-check:assembleDebug

      - name: Publish APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIANA-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish separate package installer check APK
        uses: actions/upload-artifact@v4
        with:
          name: DIANA-install-check-apk
          path: android-app/install-check/build/outputs/apk/debug/install-check-debug.apk
          if-no-files-found: error
          retention-days: 14
